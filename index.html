    <script>
      // Gracefully silence expected Vite HMR WebSocket disconnects in cloud iframe preview
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (event.reason.message?.includes('WebSocket closed without opened') || event.reason.toString().includes('WebSocket closed'))) {
          event.preventDefault();
        }
      });
    </script>
