[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-mom"
version = "0.1.0"
description = "Local-first, privacy-preserving AI assistant for Principal Architects to extract Meeting Minutes, Action Items, and ADRs."
readme = "README.md"
authors = [{ name = "Principal Architect" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0.0"]
vision = ["pillow>=10.0.0"]
cli = ["typer[all]>=0.9.0"]

[project.scripts]
arch-mom = "arch_mom.cli:main"
